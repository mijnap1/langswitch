<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Wrong keyboard. Right words.</title>
<desc id="desc">LangSwitch turns dkssud into 안녕, nihao into 你好, and arigatou into ありがとう. A repeating illustration fades between input and converted text.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0f17"/><stop offset="1" stop-color="#192239"/></linearGradient>
  <linearGradient id="line"><stop stop-color="#7c9cff"/><stop offset="1" stop-color="#b9c9ff"/></linearGradient>
</defs>
<style>
 text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif; }
 .input { animation: input 9s linear infinite; }
 .output { opacity: 0; animation: output 9s linear infinite; }
 .hint { animation: hint 9s linear infinite; }
 @keyframes input { 0%,25% {opacity:1} 29%,85% {opacity:0} 89%,100% {opacity:1} }
 @keyframes output { 0%,25% {opacity:0} 29%,85% {opacity:1} 89%,100% {opacity:0} }
 @keyframes hint { 0%,12% {opacity:0} 16%,85% {opacity:1} 89%,100% {opacity:0} }
 @media(prefers-reduced-motion:reduce) { .input,.output,.hint {animation:none} .input {opacity:0} .output,.hint {opacity:1} }
</style>
<rect width="1200" height="640" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="638" rx="27" fill="none" stroke="#2b354b"/>
<g fill="#7c9cff" font-size="14" letter-spacing="3"><text x="64" y="66">LANGSWITCH / IN A FEW KEYS</text></g>
<text x="64" y="132" fill="#eef2fc" font-size="46" font-weight="650">Keep the thought. Fix the typing.</text>
<text x="64" y="172" fill="#a5afc2" font-size="19">Three languages. A little less backspacing.</text>
<g fill="#131b2a" stroke="#303b52">
 <rect x="64" y="222" width="344" height="288" rx="20"/>
 <rect x="428" y="222" width="344" height="288" rx="20"/>
 <rect x="792" y="222" width="344" height="288" rx="20"/>
</g>
<g fill="#aab7ce" font-size="14" letter-spacing="2">
 <text x="92" y="262">01 / KOREAN</text><text x="456" y="262">02 / CHINESE</text><text x="820" y="262">03 / JAPANESE</text>
</g>
<g fill="#8694ad" font-size="17">
 <text x="92" y="300">Dubeolsik</text><text x="456" y="300">Pinyin</text><text x="820" y="300">Romaji</text>
</g>
<g class="input" fill="#eef2fc" font-size="42" font-weight="500">
 <text x="92" y="380">dkssud</text><text x="456" y="380">nihao</text><text x="820" y="380">arigatou</text>
</g>
<g class="output" fill="#b9c9ff" font-size="42" font-weight="500">
 <text x="92" y="380">안녕</text><text x="456" y="380">你好</text><text x="820" y="380">ありがとう</text>
</g>
<g class="hint">
 <g fill="#202e4b"><rect x="92" y="421" width="288" height="54" rx="12"/><rect x="456" y="421" width="288" height="54" rx="12"/><rect x="820" y="421" width="288" height="54" rx="12"/></g>
 <g fill="#c7d6ff" font-size="17"><text x="108" y="455">dkssud → 안녕</text><text x="472" y="455">nihao → 你好</text><text x="836" y="455">arigatou → ありがとう</text></g>
</g>
<rect x="64" y="555" width="1072" height="1" fill="#303b52"/>
<circle cx="74" cy="594" r="5" fill="#4ade80"/>
<text x="92" y="600" fill="#a5afc2" font-size="15">LOCAL CONVERSION</text>
<text x="1136" y="600" text-anchor="end" fill="#a5afc2" font-size="15">Auto-convert on · Space / Enter / Tab</text>
</svg>
